name: Daily AI Affiliate Publisher

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Google GenAI SDK
        run: pip install -U google-genai>=3.2.0

      - name: Generate AI Comparison Page & Rebuild Feeds
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_site.py

      - name: Commit and Push Live Site
        run: |
          git config --global user.name "AI Autopilot"
          git config --global user.email "bot@users.noreply.github.com"
          git add .
          git commit -m "Auto-publish daily AI comparison" || exit 0
          git push
          
